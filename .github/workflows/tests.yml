name: Python contracts and notebooks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-phase2.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate output-free notebook sources
        shell: python
        run: |
          from pathlib import Path
          import nbformat
          for path in Path('notebooks').glob('*.ipynb'):
              notebook=nbformat.read(path,4)
              nbformat.validate(notebook)
              for index,cell in enumerate(notebook.cells):
                  if cell.cell_type=='code':
                      assert not cell.outputs and cell.execution_count is None, path
                      compile(cell.source,f'{path}:{index}','exec')
